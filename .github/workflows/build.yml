name: Build macOS & iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS 27 & iOS 27
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Tissue Box (Release, macOS 27 arm64)
        run: |
          xcodebuild \
            -project Whiteboard.xcodeproj \
            -scheme Whiteboard \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${{ runner.temp }}/DerivedData-macOS" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=27.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Build Tissue Box (Release, iOS 27 arm64)
        run: |
          xcodebuild \
            -project Whiteboard.xcodeproj \
            -scheme Whiteboard \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${{ runner.temp }}/DerivedData-iOS" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=27.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package macOS DMG & iOS IPA
        run: |
          MAC_APP="${{ runner.temp }}/DerivedData-macOS/Build/Products/Release/Tissue Box.app"
          IOS_APP="${{ runner.temp }}/DerivedData-iOS/Build/Products/Release-iphoneos/Tissue Box.app"
          OUT="${{ runner.temp }}/dist"
          IPA_STAGE="${{ runner.temp }}/ipa-stage"

          mkdir -p "$OUT" "$IPA_STAGE/Payload"

          hdiutil create \
            -volname "Tissue Box" \
            -srcfolder "$MAC_APP" \
            -ov -format UDZO \
            "$OUT/TissueBox-macOS-arm64.dmg"

          cp -R "$IOS_APP" "$IPA_STAGE/Payload/"
          (cd "$IPA_STAGE" && zip -qry "$OUT/TissueBox-iOS-arm64.ipa" Payload)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TissueBox-macOS-iOS-27
          path: ${{ runner.temp }}/dist/*
