name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Whiteboard (Release, arm64)
        run: |
          xcodebuild \
            -project Whiteboard.xcodeproj \
            -scheme Whiteboard \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package DMG, ZIP, and checksums
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Whiteboard.app"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo '1.0')"
            VERSION="${SHORT_VER}-${GITHUB_SHA::7}"
          fi

          DIST_DIR="build/dist"
          DMG_STAGE="build/dmg-stage"

          mkdir -p "$DIST_DIR" "$DMG_STAGE"
          cp -R "$APP_PATH" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          cp LICENSE "$DMG_STAGE/"

          DMG_NAME="Doodles-${VERSION}-arm64.dmg"
          ZIP_NAME="Doodles-${VERSION}-arm64.zip"

          hdiutil create \
            -volname "Doodles ${VERSION}" \
            -srcfolder "$DMG_STAGE" \
            -ov -format UDZO \
            "$DIST_DIR/$DMG_NAME"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$DIST_DIR/$ZIP_NAME"

          (cd "$DIST_DIR" && shasum -a 256 "$DMG_NAME" "$ZIP_NAME" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation (Apple Silicon, macOS 14+)

            1. Download the `.dmg` (or `.zip`) below and copy **Whiteboard.app** to `/Applications`.
            2. Because this build is ad-hoc signed (not notarized with an Apple Developer ID), macOS Gatekeeper may block it on first launch. To allow it, either:
               - Run:
                 ```bash
                 xattr -dr com.apple.quarantine /Applications/Whiteboard.app
                 ```
               - Or open **System Settings → Privacy & Security** and click **Open Anyway**.
          files: |
            build/dist/*.dmg
            build/dist/*.zip
            build/dist/SHA256SUMS.txt

      - name: Upload Workflow Artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Doodles-arm64
          path: build/dist/*
